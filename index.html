<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dua Mode</title>
<meta name="description" content="A guided dua from authentic sources: praise of Allah, salawat, then asking for all good. Arabic with English, Urdu and Tamil, word by word.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#141a22;--card2:#1a212b;--ink:#e9e4d8;--dim:#8d96a3;--gold:#d9b25f;--green:#4fbf8b;--line:#232b36;--gloss:#a9c4b8;--shade:rgba(0,0,0,.6)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#faf7f0;--card:#fff;--card2:#f3eee2;--ink:#1f2328;--dim:#6a7380;--gold:#9a6b12;--green:#1f7a4d;--line:#e6dfd0;--gloss:#3f6b58;--shade:rgba(30,25,15,.35)}}
:root[data-theme="light"]{--bg:#faf7f0;--card:#fff;--card2:#f3eee2;--ink:#1f2328;--dim:#6a7380;--gold:#9a6b12;--green:#1f7a4d;--line:#e6dfd0;--gloss:#3f6b58;--shade:rgba(30,25,15,.35)}
:root[data-theme="dark"]{--bg:#0d1117;--card:#141a22;--card2:#1a212b;--ink:#e9e4d8;--dim:#8d96a3;--gold:#d9b25f;--green:#4fbf8b;--line:#232b36;--gloss:#a9c4b8;--shade:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;color:inherit}
.lang-u{font-family:"Noto Nastaliq Urdu",serif;direction:rtl}
.lang-t{font-family:"Noto Sans Tamil",Inter,sans-serif}

header{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;color:var(--gold);letter-spacing:.02em;white-space:nowrap}
.brand small{color:var(--dim);font-weight:400;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;max-width:70vw}
.pill:hover{border-color:var(--gold)}
.pill .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .lbl.lang-u{font-size:14px;line-height:1.9}
.bar{height:3px;background:var(--line)}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s}

main{flex:1;display:flex;justify-content:center;padding:28px 16px 36px}
.card{max-width:940px;width:100%;text-align:center}
.stage{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.stage.lang-u,.stage.lang-t{letter-spacing:0;text-transform:none;font-size:14px}
.title{font-size:18px;color:var(--dim);margin:6px 0 26px}
.title.lang-u{font-size:20px;line-height:2}
.ar{font-family:Amiri,"Traditional Arabic",serif;font-size:clamp(26px,3.6vw,40px);line-height:2.1;direction:rtl}
.arabic-only .ar{font-size:clamp(30px,4.4vw,48px);line-height:2.2}
.ww{direction:rtl;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px}
.ww .w{display:inline-flex;flex-direction:column;align-items:center;max-width:220px;padding:6px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.ww .w .a{font-family:Amiri,"Traditional Arabic",serif;font-size:clamp(22px,2.8vw,30px);line-height:1.9}
.ww .w .g{font-size:12.5px;line-height:1.45;color:var(--gloss);margin-top:2px}
.ww .w .g.lang-u{font-size:13px;line-height:2.1}
.tr{font-size:clamp(15px,1.5vw,18px);line-height:1.75;opacity:.88;margin:24px auto 0;max-width:780px}
.tr.lang-u{font-size:clamp(17px,1.7vw,20px);line-height:2.3}
.src{font-size:12.5px;color:var(--dim);margin-top:16px}
.why{font-size:13.5px;color:var(--green);margin:8px auto 0;max-width:720px;line-height:1.6}
.why.lang-u{font-size:15px;line-height:2.2}
.note{font-size:16px;line-height:1.85;max-width:720px;margin:0 auto;text-align:start}
.note.lang-u{line-height:2.4;font-size:17px}
.note li{margin:6px 0}
.count{margin-top:24px;display:inline-flex;gap:12px;align-items:center}
.count button{font-weight:600;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 22px;cursor:pointer}
.count span{color:var(--gold);font-weight:600;min-width:56px}

footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;position:sticky;bottom:0;background:var(--bg)}
footer button{font-weight:500;font-size:14px;background:none;border:1px solid var(--line);padding:9px 18px;border-radius:9px;cursor:pointer}
footer button:disabled{opacity:.35;cursor:default}
footer button:hover:not(:disabled),.count button:hover{border-color:var(--gold)}
.hint{text-align:center}

/* Settings / welcome sheet */
.sheet{position:fixed;inset:0;background:var(--shade);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px 20px}
.panel h2{margin:0 0 4px;font-size:20px;font-weight:600;text-align:center}
.panel h2.lang-u{font-size:22px;line-height:2}
.panel .sub{color:var(--dim);font-size:13.5px;text-align:center;margin-bottom:6px;line-height:1.7}
.panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:20px 0 10px;font-weight:600}
.panel h3.lang-u,.panel h3.lang-t{letter-spacing:0;text-transform:none;font-size:14px}
.opts{display:grid;gap:10px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:center}
.opt:hover{border-color:var(--gold)}
.opt.on{border-color:var(--gold);background:var(--card2)}
.opt .big{font-size:20px;font-weight:600;display:block}
.opt .big.lang-u{font-size:22px;line-height:1.9}
.opt .small{font-size:12px;color:var(--dim);display:block;margin-top:2px}
.opt.mode{text-align:start;display:flex;gap:12px;align-items:center}
.opt.mode .ico{font-size:22px;width:34px;text-align:center;flex:none}
.opt.mode .big{font-size:15.5px}
.opt.mode .small{font-size:13px}
.opt.mode .lang-u.big{font-size:17px}
.opt.mode .lang-u.small{font-size:13.5px;line-height:2}
.toc{display:grid;gap:4px}
.toc button{text-align:start;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px;display:flex;gap:10px}
.toc button:hover{background:var(--card)}
.toc button.on{background:var(--card2);color:var(--gold)}
.toc .num{color:var(--dim);min-width:22px}
.toc .lang-u{font-size:15px;line-height:2}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;cursor:pointer}
.row button:hover{border-color:var(--gold)}
.row button.primary{background:var(--gold);border-color:var(--gold);color:#16120a;font-weight:600}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
header{min-width:0}.pill{min-width:0}
html,body{overflow-x:hidden}
@media (max-width:640px){.pill{max-width:calc(100vw - 120px)}.brand small{display:none}header{padding:10px 12px}.hint{display:none}footer{padding:10px 12px}.opts.three{grid-template-columns:1fr}.opt .big{font-size:18px}.pill{font-size:13px;padding:7px 11px}}
</style>
</head>
<body>
<header>
  <div class="brand">Dua Mode <small id="stepNo"></small></div>
  <button class="pill" id="openSettings" aria-label="Language and reading settings"><span>🌐</span><span class="lbl" id="pillLbl"></span><span aria-hidden="true">▾</span></button>
</header>
<div class="bar"><i id="prog"></i></div>
<main><div class="card" id="card"></div></main>
<footer><button id="prev"></button><span class="hint" id="hint"></span><button id="next"></button></footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script src="duas.js"></script>
<script>
const LANGS = [
  { k: "e", native: "English", en: "English" },
  { k: "u", native: "اردو", en: "Urdu" },
  { k: "t", native: "தமிழ்", en: "Tamil" },
];
const MODES = [
  { k: "tr", ico: "📖" }, { k: "words", ico: "🔤" }, { k: "arabic", ico: "۞" },
];
const UI = {
  e: { tr: "Meaning", words: "Word by word", arabic: "Arabic only",
       trD: "Arabic with the full meaning below", wordsD: "The meaning under each Arabic phrase", arabicD: "Large Arabic text for reciting",
       next: "Next →", back: "← Back", ameen: "Ameen", count: "Count", share: "Share link", copied: "Link copied",
       hint: "Space / → next · ← back · C count", lang: "Language", how: "How would you like to read?", contents: "Contents",
       start: "Start", done: "Done", theme: "Light / dark", welcome: "As-salamu alaykum",
       welcomeSub: "A guided dua from the Qur'an and authentic hadith: praise Allah, send salawat on the Prophet ﷺ, then ask." },
  u: { tr: "ترجمہ", words: "لفظ بہ لفظ", arabic: "صرف عربی",
       trD: "عربی متن کے نیچے مکمل ترجمہ", wordsD: "ہر عربی جملے کے نیچے اس کا معنی", arabicD: "پڑھنے کے لیے بڑا عربی متن",
       next: "اگلا →", back: "← پچھلا", ameen: "آمین", count: "گنتی", share: "لنک شیئر کریں", copied: "لنک کاپی ہو گیا",
       hint: "", lang: "زبان", how: "آپ کیسے پڑھنا چاہیں گے؟", contents: "فہرست",
       start: "شروع کریں", done: "ٹھیک ہے", theme: "روشن / تاریک", welcome: "السلام علیکم",
       welcomeSub: "قرآن اور صحیح احادیث سے ایک رہنما دعا: پہلے اللہ کی حمد، پھر نبی ﷺ پر درود، پھر سوال۔" },
  t: { tr: "பொருள்", words: "சொல்லுக்குச் சொல்", arabic: "அரபி மட்டும்",
       trD: "அரபியின் கீழ் முழுப் பொருள்", wordsD: "ஒவ்வொரு அரபிச் சொற்றொடரின் கீழும் பொருள்", arabicD: "ஓதுவதற்குப் பெரிய அரபி எழுத்து",
       next: "அடுத்து →", back: "← முந்தைய", ameen: "ஆமீன்", count: "எண்ணுக", share: "இணைப்பைப் பகிர்", copied: "இணைப்பு நகலெடுக்கப்பட்டது",
       hint: "", lang: "மொழி", how: "எப்படிப் படிக்க விரும்புகிறீர்கள்?", contents: "உள்ளடக்கம்",
       start: "தொடங்கு", done: "சரி", theme: "ஒளி / இருள்", welcome: "அஸ்ஸலாமு அலைக்கும்",
       welcomeSub: "குர்ஆன் மற்றும் ஆதாரப்பூர்வமான ஹதீஸ்களிலிருந்து ஒரு வழிகாட்டும் துஆ: அல்லாஹ்வைப் புகழ்ந்து, நபி (ஸல்) மீது ஸலவாத் சொல்லி, பின்னர் கேளுங்கள்." },
};
const CHOOSE_ALL = "Choose your language · اپنی زبان منتخب کریں · உங்கள் மொழியைத் தேர்ந்தெடுக்கவும்";

const store = { get(k){ try { return localStorage.getItem("duamode." + k); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem("duamode." + k, v); } catch(e){} } };
const qs = new URLSearchParams(location.search);
const pick = (v, ok, d) => ok.includes(v) ? v : d;
const firstVisit = !qs.get("lang") && !store.get("lang");
let lang = pick(qs.get("lang") || store.get("lang"), ["e","u","t"], "e");
let view = pick(qs.get("view") || store.get("view"), ["tr","words","arabic"], "tr");
let i = Math.max(0, Math.min(DUAS.length - 1, (parseInt(qs.get("step"), 10) || 1) - 1));
let n = 0, welcome = false;
const theme = store.get("theme"); if (theme) document.documentElement.dataset.theme = theme;

const $ = id => document.getElementById(id);
const cls = l => l === "u" ? "lang-u" : l === "t" ? "lang-t" : "";
const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const srcText = d => d.src.map(([b, r]) => `${BOOKS[b][lang]} ${r}`).join(lang === "u" ? "، " : " · ");
const native = k => LANGS.find(l => l.k === k).native;

function render() {
  const d = DUAS[i], L = UI[lang], c = cls(lang); n = 0;
  document.documentElement.lang = { e: "en", u: "ur", t: "ta" }[lang];
  $("stepNo").textContent = `${i + 1} / ${DUAS.length}`;
  $("prog").style.width = ((i + 1) / DUAS.length * 100) + "%";
  $("pillLbl").textContent = `${native(lang)} · ${L[view]}`;
  $("pillLbl").className = "lbl " + c;
  $("hint").textContent = L.hint;
  $("prev").textContent = L.back; $("prev").disabled = i === 0; $("prev").className = c;
  $("next").textContent = i === DUAS.length - 1 ? L.ameen : L.next; $("next").className = c;

  let h = `<div class="stage ${c}">${STAGES[d.stage][lang]}</div><div class="title ${c}">${d.title[lang]}</div>`;
  if (d.list) {
    h += `<div class="note ${c}" dir="${lang === "u" ? "rtl" : "ltr"}">` + (d.intro ? `<p>${d.intro[lang]}</p>` : "") +
         `<ul>${d.list[lang].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  }
  if (d.words) {
    if (view === "words") {
      h += `<div class="ww">${d.words.map(([a, g]) => `<span class="w"><span class="a">${a}</span><span class="g ${c}">${esc(g[lang])}</span></span>`).join("")}</div>`;
    } else {
      h += `<div class="ar">${d.words.map(w => w[0]).join(" ")}</div>`;
    }
    if (view !== "arabic") {
      h += `<div class="tr ${c}">${esc(d.tr[lang])}</div>`;
      if (d.why) h += `<div class="why ${c}">${esc(d.why[lang])}</div>`;
    }
    h += `<div class="src ${c}">${srcText(d)}</div>`;
  }
  if (d.reps) h += `<div class="count"><button id="cnt" class="${c}">${L.count}</button><span id="cv">0 / ${d.reps}</span></div>`;
  const card = $("card");
  card.className = "card" + (view === "arabic" ? " arabic-only" : "");
  card.innerHTML = h;
  if (d.reps) $("cnt").onclick = count;
  history.replaceState(null, "", `?lang=${lang}&view=${view}&step=${i + 1}`);
  if ($("sheet").classList.contains("open")) renderPanel();
}

function renderPanel() {
  const L = UI[lang], c = cls(lang);
  let h = "";
  if (welcome) {
    h += `<h2 class="${c}">${L.welcome}</h2><div class="sub ${c}">${L.welcomeSub}</div>`;
    h += `<h3>${CHOOSE_ALL.split(" · ").map((s, k) => `<span class="${cls(["e","u","t"][k])}">${s}</span>`).join(" · ")}</h3>`;
  } else {
    h += `<h3 class="${c}">${L.lang}</h3>`;
  }
  h += `<div class="opts three">${LANGS.map(l => `<button class="opt ${l.k === lang ? "on" : ""}" data-lang="${l.k}">
          <span class="big ${cls(l.k)}">${l.native}</span><span class="small">${l.en}</span></button>`).join("")}</div>`;
  h += `<h3 class="${c}">${L.how}</h3>`;
  h += `<div class="opts">${MODES.map(m => `<button class="opt mode ${m.k === view ? "on" : ""}" data-view="${m.k}">
          <span class="ico">${m.ico}</span><span><span class="big ${c}">${L[m.k]}</span><span class="small ${c}">${L[m.k + "D"]}</span></span></button>`).join("")}</div>`;
  if (!welcome) {
    h += `<h3 class="${c}">${L.contents}</h3><div class="toc">${DUAS.map((d, k) =>
           `<button class="${k === i ? "on" : ""}" data-step="${k}"><span class="num">${k + 1}</span><span class="${c}">${d.title[lang]}</span></button>`).join("")}</div>`;
    h += `<div class="row"><button id="shareBtn" class="${c}">🔗 ${L.share}</button><button id="themeBtn" class="${c}">◐ ${L.theme}</button></div>`;
  }
  h += `<div class="row"><button class="primary ${c}" id="closeBtn">${welcome ? L.start : L.done}</button></div>`;
  $("panel").innerHTML = h;
  $("panel").dir = lang === "u" ? "rtl" : "ltr";
  $("panel").querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("lang", lang); render(); });
  $("panel").querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; store.set("view", view); render(); });
  $("panel").querySelectorAll("[data-step]").forEach(b => b.onclick = () => { i = +b.dataset.step; closeSheet(); render(); });
  $("closeBtn").onclick = closeSheet;
  if ($("shareBtn")) $("shareBtn").onclick = share;
  if ($("themeBtn")) $("themeBtn").onclick = toggleTheme;
}
function openSheet(isWelcome) { welcome = !!isWelcome; $("sheet").classList.add("open"); renderPanel(); }
function closeSheet() { if (welcome) { store.set("lang", lang); store.set("view", view); } welcome = false; $("sheet").classList.remove("open"); window.scrollTo(0, 0); }

function count() { const d = DUAS[i]; if (!d.reps) return; n++; const cv = $("cv"); cv.textContent = `${n} / ${d.reps}`; if (n >= d.reps) cv.style.color = "var(--green)"; }
function go(k) { const j = Math.max(0, Math.min(DUAS.length - 1, i + k)); if (j !== i) { i = j; render(); window.scrollTo(0, 0); } }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const nxt = cur === "light" ? "dark" : "light"; document.documentElement.dataset.theme = nxt; store.set("theme", nxt);
}
async function share() {
  const url = `${location.origin}${location.pathname}?lang=${lang}&view=${view}`;
  try { if (navigator.share) { await navigator.share({ title: "Dua Mode", url }); return; } await navigator.clipboard.writeText(url); toast(UI[lang].copied); }
  catch (e) { prompt("Copy this link:", url); }
}

$("next").onclick = () => go(1); $("prev").onclick = () => go(-1);
$("openSettings").onclick = () => openSheet(false);
$("sheet").onclick = e => { if (e.target.id === "sheet" && !welcome) closeSheet(); };
document.addEventListener("keydown", e => {
  if ($("sheet").classList.contains("open")) { if (e.key === "Escape" && !welcome) closeSheet(); return; }
  if (e.target.tagName === "BUTTON" && e.key === " ") e.preventDefault();
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key.toLowerCase() === "c") count();
});
let tx = null;
document.addEventListener("touchstart", e => { tx = $("sheet").classList.contains("open") ? null : e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); tx = null; });
render();
if (firstVisit) openSheet(true);
</script>
</body>
</html>
