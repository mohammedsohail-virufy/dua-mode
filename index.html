<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dua Mode</title>
<meta name="description" content="A guided dua from authentic sources: praise of Allah, salawat, then asking for all good. Arabic with English, Urdu and Tamil, word by word.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#141a22;--ink:#e9e4d8;--dim:#8d96a3;--gold:#d9b25f;--green:#4fbf8b;--line:#232b36;--gloss:#a9c4b8}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#faf7f0;--card:#fff;--ink:#1f2328;--dim:#6a7380;--gold:#9a6b12;--green:#1f7a4d;--line:#e6dfd0;--gloss:#3f6b58}}
:root[data-theme="light"]{--bg:#faf7f0;--card:#fff;--ink:#1f2328;--dim:#6a7380;--gold:#9a6b12;--green:#1f7a4d;--line:#e6dfd0;--gloss:#3f6b58}
:root[data-theme="dark"]{--bg:#0d1117;--card:#141a22;--ink:#e9e4d8;--dim:#8d96a3;--gold:#d9b25f;--green:#4fbf8b;--line:#232b36;--gloss:#a9c4b8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
.lang-u{font-family:"Noto Nastaliq Urdu",serif;direction:rtl}
.lang-t{font-family:"Noto Sans Tamil",Inter,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;color:var(--gold);letter-spacing:.02em}
.brand small{color:var(--dim);font-weight:400;margin-left:6px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:500 13px Inter,"Noto Sans Tamil","Noto Nastaliq Urdu",sans-serif;background:transparent;color:var(--dim);border:0;padding:7px 11px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}
.seg button+button{border-left:1px solid var(--line)}
.bar{height:3px;background:var(--line)}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s}
main{flex:1;display:flex;justify-content:center;padding:28px 16px 36px}
.card{max-width:940px;width:100%;text-align:center}
.stage{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.stage.lang-u,.stage.lang-t{letter-spacing:0;text-transform:none;font-size:14px}
.title{font-size:18px;color:var(--dim);margin:6px 0 26px}
.title.lang-u{font-size:20px;line-height:2}
.ar{font-family:Amiri,"Traditional Arabic",serif;font-size:clamp(26px,3.6vw,40px);line-height:2.1;direction:rtl}
.arabic-only .ar{font-size:clamp(30px,4.4vw,48px);line-height:2.2}
.ww{direction:rtl;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px}
.ww .w{display:inline-flex;flex-direction:column;align-items:center;max-width:220px;padding:6px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.ww .w .a{font-family:Amiri,"Traditional Arabic",serif;font-size:clamp(22px,2.8vw,30px);line-height:1.9}
.ww .w .g{font-size:12.5px;line-height:1.45;color:var(--gloss);margin-top:2px}
.ww .w .g.lang-u{font-size:13px;line-height:2.1}
.tr{font-size:clamp(15px,1.5vw,18px);line-height:1.75;color:var(--ink);opacity:.86;margin:24px auto 0;max-width:780px}
.tr.lang-u{font-size:clamp(17px,1.7vw,20px);line-height:2.3}
.src{font-size:12.5px;color:var(--dim);margin-top:16px}
.why{font-size:13.5px;color:var(--green);margin:8px auto 0;max-width:720px;line-height:1.6}
.why.lang-u{font-size:15px;line-height:2.2}
.note{font-size:16px;line-height:1.85;max-width:720px;margin:0 auto;text-align:start}
.note.lang-u{line-height:2.4;font-size:17px}
.note li{margin:6px 0}
.count{margin-top:24px;display:inline-flex;gap:12px;align-items:center}
.count button{font:600 15px Inter,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 22px;cursor:pointer}
.count span{color:var(--gold);font-weight:600;min-width:56px}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;position:sticky;bottom:0;background:var(--bg)}
footer button{font:500 14px Inter,"Noto Sans Tamil",sans-serif;background:none;border:1px solid var(--line);color:var(--ink);padding:9px 18px;border-radius:9px;cursor:pointer}
footer button:disabled{opacity:.35;cursor:default}
footer button:hover:not(:disabled),.count button:hover,.seg button:hover{border-color:var(--gold)}
.hint{text-align:center}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:640px){header{padding:10px 12px}.hint{display:none}footer{padding:10px 12px}.seg button{padding:7px 9px;font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="brand">Dua Mode <small id="stepNo"></small></div>
  <div class="ctrls">
    <div class="seg" id="langSeg">
      <button data-lang="e">English</button><button data-lang="u" class="lang-u" style="font-size:14px">اردو</button><button data-lang="t" class="lang-t">தமிழ்</button>
    </div>
    <div class="seg" id="viewSeg">
      <button data-view="tr"></button><button data-view="words"></button><button data-view="arabic"></button>
    </div>
    <div class="seg"><button id="share"></button><button id="theme" title="Light / dark">◐</button></div>
  </div>
</header>
<div class="bar"><i id="prog"></i></div>
<main><div class="card" id="card"></div></main>
<footer><button id="prev"></button><span class="hint" id="hint"></span><button id="next"></button></footer>
<div class="toast" id="toast"></div>
<script src="duas.js"></script>
<script>
const UI = {
  e: { tr: "Translation", words: "Word by word", arabic: "Arabic only", next: "Next →", back: "← Back", ameen: "Ameen", count: "Count",
       share: "Share link", copied: "Link copied", hint: "Space / → next · ← back · C count", step: (a,b)=>`${a} / ${b}` },
  u: { tr: "ترجمہ", words: "لفظ بہ لفظ", arabic: "صرف عربی", next: "اگلا →", back: "← پچھلا", ameen: "آمین", count: "گنتی",
       share: "لنک شیئر کریں", copied: "لنک کاپی ہو گیا", hint: "", step: (a,b)=>`${a} / ${b}` },
  t: { tr: "மொழிபெயர்ப்பு", words: "சொல்லுக்குச் சொல்", arabic: "அரபி மட்டும்", next: "அடுத்து →", back: "← முந்தைய", ameen: "ஆமீன்", count: "எண்ணுக",
       share: "இணைப்பைப் பகிர்", copied: "இணைப்பு நகலெடுக்கப்பட்டது", hint: "", step: (a,b)=>`${a} / ${b}` },
};

const store = { get(k){ try { return localStorage.getItem("duamode." + k); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem("duamode." + k, v); } catch(e){} } };
const qs = new URLSearchParams(location.search);
const pick = (v, ok, d) => ok.includes(v) ? v : d;
let lang = pick(qs.get("lang") || store.get("lang"), ["e","u","t"], "e");
let view = pick(qs.get("view") || store.get("view"), ["tr","words","arabic"], "tr");
let i = Math.max(0, Math.min(DUAS.length - 1, (parseInt(qs.get("step"), 10) || 1) - 1));
let n = 0;
const theme = store.get("theme"); if (theme) document.documentElement.dataset.theme = theme;

const $ = id => document.getElementById(id);
const cls = l => l === "u" ? "lang-u" : l === "t" ? "lang-t" : "";
const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const srcText = d => d.src.map(([b, r]) => `${BOOKS[b][lang]} ${r}`).join(lang === "u" ? "، " : " · ");

function render() {
  const d = DUAS[i], L = UI[lang], c = cls(lang); n = 0;
  document.documentElement.lang = { e: "en", u: "ur", t: "ta" }[lang];
  $("stepNo").textContent = L.step(i + 1, DUAS.length);
  $("prog").style.width = ((i + 1) / DUAS.length * 100) + "%";
  document.querySelectorAll("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  document.querySelectorAll("#viewSeg button").forEach(b => { b.textContent = L[b.dataset.view]; b.className = (b.dataset.view === view ? "on " : "") + c; });
  $("share").textContent = L.share; $("share").className = c;
  $("hint").textContent = L.hint;
  $("prev").textContent = L.back; $("prev").disabled = i === 0;
  $("next").textContent = i === DUAS.length - 1 ? L.ameen : L.next;

  let h = `<div class="stage ${c}">${STAGES[d.stage][lang]}</div><div class="title ${c}">${d.title[lang]}</div>`;
  if (d.list) {
    h += `<div class="note ${c}" dir="${lang === "u" ? "rtl" : "ltr"}">` + (d.intro ? `<p>${d.intro[lang]}</p>` : "") +
         `<ul>${d.list[lang].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  }
  if (d.words) {
    if (view === "words") {
      h += `<div class="ww">${d.words.map(([a, g]) => `<span class="w"><span class="a">${a}</span><span class="g ${c}">${esc(g[lang])}</span></span>`).join("")}</div>`;
    } else {
      h += `<div class="ar">${d.words.map(w => w[0]).join(" ")}</div>`;
    }
    if (view !== "arabic") {
      h += `<div class="tr ${c}">${esc(d.tr[lang])}</div>`;
      if (d.why) h += `<div class="why ${c}">${esc(d.why[lang])}</div>`;
    }
    h += `<div class="src ${c}">${srcText(d)}</div>`;
  }
  if (d.reps) h += `<div class="count"><button id="cnt">${L.count}</button><span id="cv">0 / ${d.reps}</span></div>`;
  const card = $("card");
  card.className = "card" + (view === "arabic" ? " arabic-only" : "");
  card.innerHTML = h;
  if (d.reps) $("cnt").onclick = count;
  history.replaceState(null, "", `?lang=${lang}&view=${view}&step=${i + 1}`);
  window.scrollTo(0, 0);
}
function count() { const d = DUAS[i]; if (!d.reps) return; n++; const cv = $("cv"); cv.textContent = `${n} / ${d.reps}`; if (n >= d.reps) cv.style.color = "var(--green)"; }
function go(k) { const j = Math.max(0, Math.min(DUAS.length - 1, i + k)); if (j !== i) { i = j; render(); } }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }

$("next").onclick = () => go(1); $("prev").onclick = () => go(-1);
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("lang", lang); render(); });
document.querySelectorAll("#viewSeg button").forEach(b => b.onclick = () => { view = b.dataset.view; store.set("view", view); render(); });
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const nxt = cur === "light" ? "dark" : "light"; document.documentElement.dataset.theme = nxt; store.set("theme", nxt);
};
$("share").onclick = async () => {
  const url = `${location.origin}${location.pathname}?lang=${lang}&view=${view}`;
  try { if (navigator.share) { await navigator.share({ title: "Dua Mode", url }); return; } await navigator.clipboard.writeText(url); toast(UI[lang].copied); }
  catch (e) { prompt("Copy this link:", url); }
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && e.key === " ") e.preventDefault();
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key.toLowerCase() === "c") count();
});
let tx = null;
document.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); tx = null; });
render();
</script>
</body>
</html>
